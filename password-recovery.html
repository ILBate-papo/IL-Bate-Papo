<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Nova senha — IL Bate Papo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#070c18;color:#edf5ff;font:17px system-ui;padding:22px}main{width:min(100%,440px);padding:28px;border:1px solid #264558;border-radius:22px;background:#0c1626}h1{font-size:27px}label{display:block;margin:18px 0}input,button{font:inherit;width:100%;padding:14px;border-radius:12px}input{margin-top:8px;background:#07101e;color:inherit;border:1px solid #587388}button{border:0;background:#23d8e5;color:#04121c;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:#52e4ee}#status{line-height:1.5;overflow-wrap:anywhere}a{display:inline-block;margin-top:20px}[hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <h1>Crie sua nova senha</h1>
  <p id="status" role="status" aria-live="polite">Conferindo o link de recuperação…</p>
  <form id="recovery-form" hidden>
    <label>Nova senha<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Confirme a nova senha<input id="confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
    <button id="save" type="submit">Salvar nova senha</button>
  </form>
  <a href="./">Voltar para entrar no IL Bate Papo</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./password-recovery.js?v=20261020-1"></script>
</body>
</html>
