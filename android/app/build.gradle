plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
 namespace 'br.com.ilbatepapo.app'
 compileSdk 35
 defaultConfig { applicationId 'br.com.ilbatepapo.app'; minSdk 26; targetSdk 35; versionCode 16; versionName '1.1.4-DIAG' }
 buildTypes { release { minifyEnabled false } }
}

// Credentials for release signing stay outside the repository.
def keyFile = System.getenv('ILBP_KEYSTORE')
android {
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 if (keyFile) {
  signingConfigs { original { storeFile file(keyFile); storePassword System.getenv('ILBP_STORE_PASSWORD'); keyAlias System.getenv('ILBP_KEY_ALIAS'); keyPassword System.getenv('ILBP_KEY_PASSWORD') } }
  buildTypes { release { signingConfig signingConfigs.original } }
 }
}
dependencies { implementation platform('com.google.firebase:firebase-bom:34.7.0'); implementation 'com.google.firebase:firebase-messaging' }

android {
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   jvmArgs += ['--add-opens=java.base/java.lang=ALL-UNNAMED','--add-opens=java.base/java.util=ALL-UNNAMED','--add-opens=java.base/java.io=ALL-UNNAMED','--add-opens=java.base/java.net=ALL-UNNAMED','--add-opens=java.base/java.security=ALL-UNNAMED','--add-opens=java.base/java.text=ALL-UNNAMED','--add-opens=java.base/jdk.internal.access=ALL-UNNAMED','--add-opens=java.desktop/java.awt.font=ALL-UNNAMED','--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED']
  }
 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.17' }
