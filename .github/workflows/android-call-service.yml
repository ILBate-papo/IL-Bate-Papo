name: Android native call service
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-call-service.yml'
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
        with:
          gradle-version: '8.11.1'
      - name: Compile and exercise native call lifecycle
        working-directory: android
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Package unsigned APK and public signing tools
        run: |
          mkdir -p "$RUNNER_TEMP/ilbp-build"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/ilbp-build/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/ilbp-build/"
          cp android/tools/SignAndVerify.java "$RUNNER_TEMP/ilbp-build/"
          sha256sum "$RUNNER_TEMP/ilbp-build/"* > "$RUNNER_TEMP/ilbp-build/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: ilbp-android-1.1.3-unsigned
          path: ${{ runner.temp }}/ilbp-build/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: android/app/build/test-results/
          retention-days: 3
