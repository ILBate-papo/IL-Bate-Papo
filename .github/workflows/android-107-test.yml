name: Android 1.0.7 test build
on:
  push:
    branches:
      - fix/android-call-notifications-20261102
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile diagnostic debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: il-bate-papo-1.0.7-debug-diagnostic
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
